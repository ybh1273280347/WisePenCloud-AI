[project]
name = "wisepen-rag-service-v2"
version = "0.1.0"
description = "WisePen RAG service v2"
requires-python = ">=3.11"
dependencies = [
    "beanie>=2,<3",
    "bm25s>=0.3.9",
    "dependency-injector>=4.49,<5",
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.0,<2",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "numpy>=2.4.6",
    "openai",
    "pydantic",
    "pydantic-settings",
    "pymongo>=4.17.0",
    "pyyaml",
    "qdrant-client==1.18.0",
    "thulac>=0.2.2",
    "wisepen-common",
    "zeroentropy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
