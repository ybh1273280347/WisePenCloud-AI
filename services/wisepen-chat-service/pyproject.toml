[project]
name = "wisepen-chat-service"
version = "0.1.0"
description = "WisePen Chat Microservice: RAG & LLM Orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiazheng Sun", email = "jzsun24@m.fudan.edu.cn" }
]
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "dependency_injector",
    "litellm",
    "mem0ai",
    "openai",
    "anthropic",
    "google-genai",
    "dashscope",
    "docling",
    "pymupdf4llm",
    "markitdown",
    "trafilatura",
    "beautifulsoup4",
    "markdownify",
    "magika",
    "langchain_text_splitters",
    "pandas",
    "openpyxl",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
    "bm25s>=0.3.9",
    "thulac",
    "ddgs>=9.14.4",
    "dicttoxml",
    "jsonschema",
    "tabulate",
    "markdown-it-py",
    "mdit-py-plugins",
    "beanie",
    "redis",
    "nacos-sdk-python",
    "pyyaml",
    "jieba",
    "zeroentropy",
    "wisepen-common",
    "httpx",
    "PyGithub",
    "cryptography",
    "hishel[async]",
    "arq>=0.28.0",
    "async_lru",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
