# ============================================================
# Nacos 配置中心 - wisepen-chat-service-dev.yaml
# Data ID : wisepen-chat-service-dev.yaml
# Group   : DEFAULT_GROUP
# Namespace: public（根据实际 namespace 调整）
#
# 说明：此文件中的键名对应 Settings 类的字段名（大写），
#       Nacos 拉取后会覆盖本地 .env 的同名字段。
# ============================================================

# --- 服务基础 ---
APP_NAME: "WisePen Chat Service"
SERVICE_NAME: "wisepen-chat-service"
SERVICE_HOST: "0.0.0.0"     # 生产环境改为实际内网 IP 或 0.0.0.0
SERVICE_PORT: 19904
DEV: true

# --- LLM 统一网关 ---
LLM_BASE_URL: "https://api.zhizengzeng.com/v1"
LLM_API_KEY: "sk-your-production-key-here"

# --- 工具性小模型配置 ---
# 小模型仅用于 application 层工具性调用（answerability gate / context indexing / ranking 等），
# 禁止与主对话模型、记忆模型、摘要模型交叉复用。
QUERY_MODEL: "deepseek-v4-flash"
EMBEDDING_MODEL: "qwen3-embedding-8b"
EMBEDDING_DIMENSIONS: 4096
SUMMARY_MODEL: ""  # 仅用于长文本摘要，必须单独配置，禁止挪作小模型调用


# --- 安全 ---
